{% extends 'base.html' %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h3 class="fw-bold mb-3">Añadir Producto a la Venta</h3>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre del Producto / Refacción</label>
                    <input type="text" name="nombre" class="form-control" required placeholder="Ej. Booster de Frenos - OEM">
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Marca</label>
                        <input type="text" name="marca" class="form-control" placeholder="Ej. BOGE / DEPO">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Modelo Compatible</label>
                        <input type="text" name="modelo" class="form-control" placeholder="Ej. Ford Fiesta">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Años</label>
                        <input type="text" name="anio" class="form-control" placeholder="Ej. 2014-2019">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Categoría / Sistema</label>
                        <input type="text" name="categoria" class="form-control" required placeholder="Ej. Frenos / Iluminación">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio ($ MXN)</label>
                        <input type="number" step="0.01" name="precio" class="form-control" required placeholder="0.00">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <select name="estado" class="form-select">
                            <option value="Disponible">Disponible</option>
                            <option value="Agotado">Agotado</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">URL de la Imagen</label>
                    <input type="url" name="imagen" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción Técnica</label>
                    <textarea name="descripcion" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success fw-bold w-100 py-2">Guardar Producto</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

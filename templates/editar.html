{% extends 'base.html' %}
{% block contenido %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-3">Modificar Refacción</h2>
                <form method="post">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Pieza o Refacción</label>
                        <input id="nombre" name="nombre" class="form-control" value="{{ pieza.nombre }}" required maxlength="80">
                    </div>
                    <div class="mb-3">
                        <label for="categoria" class="form-label">Sistema / Categoría</label>
                        <input id="categoria" name="categoria" class="form-control" value="{{ pieza.categoria }}" required maxlength="20">
                    </div>
                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select id="estado" name="estado" class="form-select" required>
                            <option value="Disponible" {% if pieza.estado == 'Disponible' %}selected{% endif %}>Disponible</option>
                            <option value="Agotado" {% if pieza.estado == 'Agotado' %}selected{% endif %}>Agotado</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('inicio') }}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block contenido %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="h3 mb-3 text-center">Iniciar Sesión</h2>
            
            {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" name="usuario" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-secondary">¿No tienes cuenta? <a href="{{ url_for('registro') }}" class="text-decoration-none">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
